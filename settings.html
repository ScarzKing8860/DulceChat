<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DulceChat Settings</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="settings.css" />
</head>
<body>
    <div class="settings-shell">
        <header class="settings-header">
            <div>
                <h1>⚙️ Settings</h1>
            </div>
            <nav class="settings-nav">
                <a href="index.html">← Studio</a>
                <a href="profile.html">👤 Profile</a>
                <a href="dashboard.html">📊 Dashboard</a>
                <a href="browser.html">🌐 Browser</a>
            </nav>
        </header>

        <main class="settings-content">
            <section class="settings-card">
                <h2>Studio Preferences</h2>
                <div class="settings-grid">
                    <div class="setting-row">
                        <div>
                            <label for="autoStartToggle">Auto-start camera</label>
                            <small>Start the webcam automatically when the studio opens.</small>
                        </div>
                        <button id="autoStartToggle" class="toggle" type="button" aria-pressed="false"></button>
                    </div>
                    <div class="setting-row">
                        <div>
                            <label for="chatAlertsToggle">Chat alerts</label>
                            <small>Show quick notifications when chat messages arrive.</small>
                        </div>
                        <button id="chatAlertsToggle" class="toggle" type="button" aria-pressed="false"></button>
                    </div>
                    <div class="setting-row">
                        <div>
                            <label for="compactLayoutToggle">Compact layout</label>
                            <small>Use a tighter panel layout for smaller screens.</small>
                        </div>
                        <button id="compactLayoutToggle" class="toggle" type="button" aria-pressed="false"></button>
                    </div>
                </div>
            </section>

            <section class="settings-card">
                <h2>Account & Data</h2>
                <div class="settings-actions">
                    <a class="btn btn-primary" href="profile.html">Open Profile</a>
                    <button class="btn btn-secondary" id="clearLocalData" type="button">Clear Saved Data</button>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
    <script src="settings.js"></script>
</body>
</html>
