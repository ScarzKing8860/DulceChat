    <title>Page Not Found</title>
    <link rel="stylesheet" href="style.css" />

        body { min-height: 100vh; display:grid; place-items:center; background: linear-gradient(135deg, #0f1426 0%, #1a2a4a 50%, #0f1426 100%); }

        p { color:#cad9f5; }
        a { display:inline-block; margin-top: 16px; padding: 12px 16px; border-radius: 10px; background:#56b2ff; color:#07111e; text-decoration:none; font-weight:700; }

</head>
<body>
    <div class="card">
